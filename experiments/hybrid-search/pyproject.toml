[project]
name = "hybrid-search-experiments"
version = "0.1.0"
description = "Reproducible BEIR hybrid retrieval, reranking, and selective reranking experiments"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "sentence-transformers>=5,<6", "rank-bm25==0.2.2", "nltk>=3.9,<4", "httpx>=0.28,<1", "matplotlib>=3.10,<4", "scikit-learn>=1.6,<2", "python-dotenv>=1,<2", "markdown-it-py>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
